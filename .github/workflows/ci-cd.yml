name: CI/CD Pipeline

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- TRABAJO 1: INTEGRACIÓN CONTINUA (TESTS) ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Instalar pnpm (Esto es nuevo y necesario)
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 2. Configurar Node con caché para pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # 3. Instalar dependencias con comando de pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 4. Aquí se ejecutan tus tests definidos en package.json
      - name: Run Tests
        run: pnpm test

  # --- TRABAJO 2: DESPLIEGUE CONTINUO (BUILD & PUSH) ---
  build-and-push:
    needs: test # Solo se ejecuta si los tests pasan
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEFAULT_PAGINATION_LIMIT=${{ secrets.DEFAULT_PAGINATION_LIMIT }}

  # --- TRABAJO 3: NOTIFICAR A DOKPLOY ---
  deploy-to-dokploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Webhook
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}/api/application.deploy" \
          -H "X-API-KEY: ${{ secrets.DOKPLOY_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{ "applicationId": "${{ secrets.DOKPLOY_APP_ID }}" }'
